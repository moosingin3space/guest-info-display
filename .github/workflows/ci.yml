name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-home
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and test
        uses: wolfi-dev/wolfi-act@7f6915e256697663d18940570e932e990e6adb93 # main
        with:
          packages: rust,libxcb-dev,libxkbcommon-dev,pkgconf,clang-22,openssl-dev,alsa-lib-dev,fontconfig-dev,freetype-dev
          command: |
            export CARGO_HOME=/work/.cargo-home
            cargo build --release
            cargo test --release

  check-generated-sources:
    name: Check generated-sources.json in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify generated-sources.json matches Cargo.lock
        uses: wolfi-dev/wolfi-act@7f6915e256697663d18940570e932e990e6adb93 # main
        with:
          packages: python-3.13,py3-aiohttp,py3-tomlkit,curl,git
          command: |
            curl -fsSL \
              "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py" \
              -o /tmp/flatpak-cargo-generator.py
            python3 /tmp/flatpak-cargo-generator.py /work/Cargo.lock -o /tmp/generated-sources-new.json
            if ! diff -q /work/generated-sources.json /tmp/generated-sources-new.json > /dev/null 2>&1; then
              echo "generated-sources.json is out of sync with Cargo.lock."
              echo "Regenerate with: python3 flatpak-cargo-generator.py Cargo.lock -o generated-sources.json"
              diff /work/generated-sources.json /tmp/generated-sources-new.json | head -40 || true
              exit 1
            fi
            echo "generated-sources.json is up to date."

  flatpak:
    name: Build Flatpak
    needs: check-generated-sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          bundle: guest-info-display.flatpak
          manifest-path: xyz.mooshq.GuestInfoDisplay.json
          cache: true
          restore-cache: true
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-info-display-flatpak
          path: guest-info-display.flatpak
          if-no-files-found: error
          retention-days: 30
