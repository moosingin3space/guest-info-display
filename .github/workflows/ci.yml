name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-home
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and test
        uses: wolfi-dev/wolfi-act@7f6915e256697663d18940570e932e990e6adb93 # main
        with:
          packages: rust,pkgconf,clang-22,openssl-dev,alsa-lib-dev,fontconfig-dev,freetype-dev,mesa-dev,wayland-dev,libstdc++-dev
          command: |
            export CARGO_HOME=/work/.cargo-home
            cargo build --release
            cargo test --release

  generate-flatpak-sources:
    name: Generate Flatpak Cargo sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate generated-sources.json from Cargo.lock
        uses: wolfi-dev/wolfi-act@7f6915e256697663d18940570e932e990e6adb93 # main
        with:
          packages: python-3.13,py3-aiohttp,py3-tomlkit,curl,git
          command: |
            curl -fsSL \
              "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/de2225a6dee4818c1339b3cdbf29f90c471fcb7e/cargo/flatpak-cargo-generator.py" \
              -o /tmp/flatpak-cargo-generator.py
            python3 /tmp/flatpak-cargo-generator.py /work/Cargo.lock -o /work/generated-sources.json

      - name: Upload generated Cargo sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-cargo-sources
          path: generated-sources.json
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Build Flatpak
    needs: generate-flatpak-sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generated Cargo sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flatpak-cargo-sources
          path: .

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: guest-info-display.flatpak
          manifest-path: xyz.mooshq.GuestInfoDisplay.json
          cache: true
          restore-cache: true
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-info-display-flatpak
          path: guest-info-display.flatpak
          if-no-files-found: error
          retention-days: 30
