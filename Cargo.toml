[package]
name = "guest-info-display"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
chrono = "0.4"
futures-util = "0.3"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
librespot = "0.8.0"
log = "0.4.29"
pretty_env_logger = "0.5.0"
qrcodegen = "1.8.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
vergen = "=9.0"

[build-dependencies]
pkg-config = "0.3.33"
