[package]
name = "guest-info-display"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.13", features = ["inhibit"] }
async-channel = "2"
bytes = "1"
chrono = "0.4"
cpal = "0.16"
futures-util = "0.3"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
iroh = { version = "0.98", features = ["address-lookup-mdns"] }
irpc = { version = "0.14", features = ["derive", "rpc"] }
irpc-iroh = "0.14"
librespot = { git = "https://github.com/librespot-org/librespot", features = ["rodio-backend"] }
log = "0.4.29"
pretty_env_logger = "0.5.0"
qrcodegen = "1.8.0"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
smallvec = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
vergen = "=9.0"

[build-dependencies]
pkg-config = "0.3.33"

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
